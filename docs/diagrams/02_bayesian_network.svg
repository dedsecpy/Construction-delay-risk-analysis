<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1180" viewBox="0 0 1180 1180" role="img" aria-labelledby="title desc">
  <title id="title">Bayesian Network with PDTs</title>
  <desc id="desc">Oval-node BN plus Bernoulli prior PDTs and Noisy-OR CPT for severe_delay.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <filter id="soft" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.3" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f5f7fa; }
      .title { font: 700 20px Arial, sans-serif; fill: #17171b; }
      .sub { font: 500 13px Arial, sans-serif; fill: #5c6670; }
      .sec { font: 700 11px Arial, sans-serif; fill: #0b5dd0; letter-spacing: 0.05em; }
      .oval { fill: #e8f0fb; stroke: #0b5dd0; stroke-width: 2; }
      .oval-y { fill: #ffe8e4; stroke: #ff4026; stroke-width: 2.4; }
      .cptbox { fill: #fff8f0; stroke: #b45309; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .panel { fill: #fff; stroke: #d7dee7; stroke-width: 1.5; }
      .nid { font: 700 12px Arial, sans-serif; fill: #17171b; }
      .meta { font: 500 11px Arial, sans-serif; fill: #5c6670; }
      .mono { font: 600 11px Consolas, monospace; fill: #17171b; }
      .th { font: 700 11px Arial, sans-serif; fill: #17171b; }
      .td { font: 500 11px Consolas, monospace; fill: #17171b; }
      .edge { fill: none; stroke: #333; stroke-width: 1.5; marker-end: url(#arr); }
      .hline { stroke: #d7dee7; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1180" height="1180" class="bg"/>
  <text x="36" y="36" class="title">Bayesian Network + Probability Distribution Tables (PDT)</text>
  <text x="36" y="58" class="sub">DRIN · oval random variables · Bernoulli priors · Noisy-OR CPT for severe_delay · p_c=0.55 · ℓ=0.02</text>

  <!-- ===== Graph ===== -->
  <text x="36" y="92" class="sec">1 · GRAPH STRUCTURE</text>

  <g filter="url(#soft)">
    <ellipse cx="130" cy="170" rx="88" ry="40" class="oval"/>
    <text x="130" y="166" text-anchor="middle" class="nid">budget</text>
    <text x="130" y="184" text-anchor="middle" class="mono">F1</text>

    <ellipse cx="310" cy="170" rx="88" ry="40" class="oval"/>
    <text x="310" y="166" text-anchor="middle" class="nid">scope_design</text>
    <text x="310" y="184" text-anchor="middle" class="mono">F2</text>

    <ellipse cx="490" cy="170" rx="96" ry="40" class="oval"/>
    <text x="490" y="166" text-anchor="middle" class="nid">grants_approvals</text>
    <text x="490" y="184" text-anchor="middle" class="mono">F3</text>

    <ellipse cx="680" cy="170" rx="88" ry="40" class="oval"/>
    <text x="680" y="166" text-anchor="middle" class="nid">procurement</text>
    <text x="680" y="184" text-anchor="middle" class="mono">F4</text>

    <ellipse cx="880" cy="170" rx="110" ry="42" class="oval"/>
    <text x="880" y="164" text-anchor="middle" class="nid">construction_conditions</text>
    <text x="880" y="182" text-anchor="middle" class="mono">F5</text>
  </g>

  <g filter="url(#soft)">
    <ellipse cx="220" cy="280" rx="100" ry="40" class="oval"/>
    <text x="220" y="276" text-anchor="middle" class="nid">external_dependency</text>
    <text x="220" y="294" text-anchor="middle" class="mono">F6</text>

    <ellipse cx="450" cy="280" rx="100" ry="40" class="oval"/>
    <text x="450" y="276" text-anchor="middle" class="nid">workforce_resource</text>
    <text x="450" y="294" text-anchor="middle" class="mono">F7</text>

    <ellipse cx="680" cy="280" rx="88" ry="40" class="oval"/>
    <text x="680" y="276" text-anchor="middle" class="nid">other_admin</text>
    <text x="680" y="294" text-anchor="middle" class="mono">F8</text>
  </g>

  <!-- edges to CPT -->
  <path d="M130 210 V340" class="edge"/>
  <path d="M310 210 V340" class="edge"/>
  <path d="M490 210 V340" class="edge"/>
  <path d="M680 210 V340" class="edge"/>
  <path d="M880 212 V340" class="edge"/>
  <path d="M220 320 V340" class="edge"/>
  <path d="M450 320 V340" class="edge"/>
  <path d="M680 320 V340" class="edge"/>
  <path d="M130 340 H880" class="edge" marker-end="none"/>
  <path d="M505 340 V360" class="edge"/>

  <rect x="250" y="360" width="510" height="70" class="cptbox" rx="35" filter="url(#soft)"/>
  <text x="505" y="388" text-anchor="middle" class="nid">Noisy-OR CPT  ·  P(Y | F1…F8)</text>
  <text x="505" y="410" text-anchor="middle" class="mono">P(Y=yes|F)=1-(1-ℓ)∏ᵢ∈on(1-p_c)</text>

  <path d="M505 430 V460" class="edge"/>

  <ellipse cx="505" cy="520" rx="170" ry="55" class="oval-y" filter="url(#soft)"/>
  <text x="505" y="508" text-anchor="middle" class="nid">severe_delay  ·  Y</text>
  <text x="505" y="528" text-anchor="middle" class="meta">states: no | yes</text>
  <text x="505" y="548" text-anchor="middle" class="mono">query P(Y=yes | evidence)</text>

  <!-- ===== PDT: Factor priors ===== -->
  <text x="36" y="620" class="sec">2 · PDT — FACTOR PRIORS  P(Fᵢ)  · Bernoulli · disagreement priors</text>
  <rect x="36" y="636" width="1108" height="230" class="panel" rx="8" filter="url(#soft)"/>

  <!-- table header -->
  <text x="56" y="662" class="th">Factor Fᵢ</text>
  <text x="320" y="662" class="th">States</text>
  <text x="520" y="662" class="th">P(absent)</text>
  <text x="700" y="662" class="th">P(present)</text>
  <text x="900" y="662" class="th">PDT type</text>
  <line x1="56" y1="672" x2="1120" y2="672" class="hline"/>

  <!-- rows -->
  <text x="56" y="694" class="td">budget</text>
  <text x="320" y="694" class="td">{absent, present}</text>
  <text x="520" y="694" class="td">0.50</text>
  <text x="700" y="694" class="td">0.50</text>
  <text x="900" y="694" class="td">Bernoulli</text>

  <text x="56" y="716" class="td">scope_design</text>
  <text x="320" y="716" class="td">{absent, present}</text>
  <text x="520" y="716" class="td">0.58</text>
  <text x="700" y="716" class="td">0.42</text>
  <text x="900" y="716" class="td">Bernoulli</text>

  <text x="56" y="738" class="td">grants_approvals</text>
  <text x="320" y="738" class="td">{absent, present}</text>
  <text x="520" y="738" class="td">0.58</text>
  <text x="700" y="738" class="td">0.42</text>
  <text x="900" y="738" class="td">Bernoulli</text>

  <text x="56" y="760" class="td">procurement</text>
  <text x="320" y="760" class="td">{absent, present}</text>
  <text x="520" y="760" class="td">0.82</text>
  <text x="700" y="760" class="td">0.18</text>
  <text x="900" y="760" class="td">Bernoulli</text>

  <text x="56" y="782" class="td">construction_conditions</text>
  <text x="320" y="782" class="td">{absent, present}</text>
  <text x="520" y="782" class="td">0.82</text>
  <text x="700" y="782" class="td">0.18</text>
  <text x="900" y="782" class="td">Bernoulli</text>

  <text x="56" y="804" class="td">external_dependency</text>
  <text x="320" y="804" class="td">{absent, present}</text>
  <text x="520" y="804" class="td">0.82</text>
  <text x="700" y="804" class="td">0.18</text>
  <text x="900" y="804" class="td">Bernoulli</text>

  <text x="56" y="826" class="td">workforce_resource</text>
  <text x="320" y="826" class="td">{absent, present}</text>
  <text x="520" y="826" class="td">0.82</text>
  <text x="700" y="826" class="td">0.18</text>
  <text x="900" y="826" class="td">Bernoulli</text>

  <text x="56" y="848" class="td">other_admin</text>
  <text x="320" y="848" class="td">{absent, present}</text>
  <text x="520" y="848" class="td">0.65</text>
  <text x="700" y="848" class="td">0.35</text>
  <text x="900" y="848" class="td">Bernoulli</text>

  <!-- ===== PDT: Noisy-OR CPT ===== -->
  <text x="36" y="900" class="sec">3 · PDT — CHILD CPT  P(Y | parents)  · Noisy-OR · full table has 2⁸ = 256 rows (shown by #present causes k)</text>
  <rect x="36" y="916" width="1108" height="240" class="panel" rx="8" filter="url(#soft)"/>

  <text x="56" y="942" class="th">k = # present factors</text>
  <text x="280" y="942" class="th">Example configuration</text>
  <text x="620" y="942" class="th">P(Y = no)</text>
  <text x="820" y="942" class="th">P(Y = yes)</text>
  <text x="1000" y="942" class="th">Formula</text>
  <line x1="56" y1="952" x2="1120" y2="952" class="hline"/>

  <text x="56" y="976" class="td">k = 0</text>
  <text x="280" y="976" class="td">all Fᵢ = absent</text>
  <text x="620" y="976" class="td">0.980</text>
  <text x="820" y="976" class="td">0.020</text>
  <text x="1000" y="976" class="td">= ℓ</text>

  <text x="56" y="1000" class="td">k = 1</text>
  <text x="280" y="1000" class="td">exactly one Fᵢ = present</text>
  <text x="620" y="1000" class="td">0.441</text>
  <text x="820" y="1000" class="td">0.559</text>
  <text x="1000" y="1000" class="td">1-(1-ℓ)(1-p_c)</text>

  <text x="56" y="1024" class="td">k = 2</text>
  <text x="280" y="1024" class="td">e.g. budget + construction</text>
  <text x="620" y="1024" class="td">0.198</text>
  <text x="820" y="1024" class="td">0.802</text>
  <text x="1000" y="1024" class="td">1-(1-ℓ)(1-p_c)²</text>

  <text x="56" y="1048" class="td">k = 3</text>
  <text x="280" y="1048" class="td">any 3 factors present</text>
  <text x="620" y="1048" class="td">0.089</text>
  <text x="820" y="1048" class="td">0.911</text>
  <text x="1000" y="1048" class="td">1-(1-ℓ)(1-p_c)³</text>

  <text x="56" y="1072" class="td">k = 4</text>
  <text x="280" y="1072" class="td">any 4 factors present</text>
  <text x="620" y="1072" class="td">0.040</text>
  <text x="820" y="1072" class="td">0.960</text>
  <text x="1000" y="1072" class="td">1-(1-ℓ)(1-p_c)⁴</text>

  <text x="56" y="1096" class="td">k = 8</text>
  <text x="280" y="1096" class="td">all Fᵢ = present</text>
  <text x="620" y="1096" class="td">0.002</text>
  <text x="820" y="1096" class="td">0.998</text>
  <text x="1000" y="1096" class="td">1-(1-ℓ)(1-p_c)⁸</text>

  <text x="56" y="1130" class="meta">Note: Noisy-OR depends only on how many parents are present (and p_c, ℓ), not which ones — so rows with the same k share the same CPT values. Exact inference still sums over which specific configs match the evidence.</text>
  <text x="56" y="1150" class="meta">Worked example (105 PCT): after inspecting construction_conditions + budget (k=2, others absent) → P(Y=yes)=0.802 → escalate if ≥ τ≈0.57.</text>
</svg>
